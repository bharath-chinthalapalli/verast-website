<section class="w-full flex flex-col">
    <div class="flex flex-col gap-6">
        <div class="text-left 3xs:text-center flex flex-col gap-4">
            <div
                class="w-full 3xs:text-center text-left leading-relaxed font-bold 5xs:text-3xl 4xs:text-[32px] 3xs:text-[32px] xl:text-[32px] 2xl:text-[40px] 2xl:leading-10 3xl:text-[40px] 3xl:leading-10 4xl:text-5xl 5xl:text-5xl 6xl:text-5xl 7xl:text-5xl 8xl:text-6xl text-royalBlue">
                Core
                <span class="text-skyBlue">Values</span>
            </div>
        </div>
        <div class="grid xl:grid-cols-4 lg:grid-cols-3 sm:grid-cols-2 xs:grid-cols-1 gap-6">
            @for (item of coreList(); track $index) {
            <div
                class="relative group cursor-auto bg-lightCyan hover:bg-royalBlue transition-colors duration-500 flex flex-col gap-6 pt-10 pb-4 px-4 text-center overflow-hidden">

                <!-- Glowing Circle INSIDE box -->
                <div
                    class="absolute -top-[24px] left-0 w-[500px] h-[500px] bg-skyBlue rounded-full opacity-20 transform translate-x-2 translate-y-10 scale-0 group-hover:scale-100 transition-transform duration-700 ease-out z-0">
                </div>

                <!-- Icons -->
                <img [src]="item.imageDefault"
                    class="block group-hover:hidden transition-opacity duration-500 w-1/4 m-auto z-[20px] relative"
                    [alt]="item.imageDefault" loading="lazy" decoding="async">
                <img [src]="item.imageHover"
                    class="hidden group-hover:block transition-opacity duration-500 w-1/4 m-auto z-[20px] relative"
                    [alt]="item.imageDefault" loading="lazy" decoding="async">

                <!-- Title -->
                <div
                    class="text-xl text-royalBlue tracking-wider group-hover:text-white font-bold xl:line-clamp-2 line-clamp-0 min-h-[20px]  z-[20px] relative">
                    {{item.title}}
                </div>

                <!-- Subtitle -->
                <div
                    class="text-base text-lightGray group-hover:text-white font-normal font-poppins xl:line-clamp-8 line-clamp-4 min-h-[80px]  z-[20px] relative">
                    {{item.subTitle}}
                </div>
            </div>
            }
        </div>
    </div>
</section>
