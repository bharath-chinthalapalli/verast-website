<section class=" w-full flex flex-col">
    <div class="flex flex-col gap-6">
        <div class="text-left 3xs:text-center flex flex-col gap-4">
            <div
                class="w-full 3xs:text-center text-left leading-relaxed font-bold 5xs:text-3xl 4xs:text-[32px] 3xs:text-[32px] xl:text-[32px] 2xl:text-[40px] 2xl:leading-10 3xl:text-[40px] 3xl:leading-10 4xl:text-5xl 5xl:text-5xl 6xl:text-5xl 7xl:text-5xl 8xl:text-6xl text-royalBlue">
                Growth
                <span class="text-skyBlue">Strategy</span>
            </div>
        </div>
        <div class="grid xl:grid-cols-4 lg:grid-cols-3 sm:grid-cols-2 xs:grid-cols-1 gap-6">
            @for (item of growthStrategiesList(); track $index) {
            <div
                class="relative group cursor-auto bg-white hover:bg-moreLightCyan transition-colors duration-500 flex flex-col gap-6 pt-10 pb-2 px-2 text-center overflow-hidden hover:border-none border-[1.5px] border-[#4F4F64]/20">
                <!-- Icons -->
                <img [src]="item.imageDefault"
                    class="block group-hover:hidden transition-opacity duration-500 w-1/4 m-auto  z-[20px] relative"
                    [alt]="item.imageDefault" loading="lazy" decoding="async">
                <img [src]="item.imageHover"
                    class="hidden group-hover:block transition-opacity duration-500 w-1/4 m-auto  z-[20px] relative"
                    [alt]="item.imageDefault" loading="lazy" decoding="async">

                <!-- Title -->
                <div
                    class="text-base text-royalBlue font-poppins font-medium tracking-wider line-clamp-4 min-h-[100px]  z-[20px] relative">
                    {{item.title}}
                </div>

                <!-- Bottom line + triangle -->
                <div
                    class="absolute -bottom-1.5 left-0 w-full h-[8px] opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <div class="h-[2px] bg-cyan-400 w-full relative">
                        <div
                            class="absolute left-1/2 -translate-x-1/2 -top-[6px] w-0 h-0 border-l-[6px] border-r-[6px] border-b-[6px] border-l-transparent border-r-transparent border-b-cyan-400">
                        </div>
                    </div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
