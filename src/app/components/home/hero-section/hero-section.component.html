<section class="relative bg-moreLightCyan w-full overflow-hidden min-h-fit">
    <div class="grid lg:grid-cols-2 sm:grid-cols-1 items-center gap-7 w-full justify-between 3xs:px-[60px] px-5">
        <div class="relative w-full flex flex-col gap-4 lg:mt-0 mt-24">
            <div
                class="absolute top-0 left-0 w-[400px] h-[400px] xs:w-[450px] xs:h-[450px] sm:w-[500px] sm:h-[500px] md:w-[550px] md:h-[550px] lg:w-[600px] lg:h-[600px] xl:w-[700px] xl:h-[700px] 2xl:w-[700px] 2xl:h-[700px] 3xl:w-[850px] 3xl:h-[850px] 4xl:w-[850px] 4xl:h-[850px] 5xl:w-[1000px] 5xl:h-[1000px] 6xl:w-[1100px] 6xl:h-[1100px] 7xl:w-[1100px] 7xl:h-[1100px] 8xl:w-[1200px] 8xl:h-[1200px] bg-[#CFFFFF]/45 rounded-full z-0 translate-x-[-30%] translate-y-[-30%]">
            </div>

            <div class="z-10 w-full flex flex-wrap items-center font-bold leading-relaxed 
                                                  5xs:text-[32px] 4xs:text-[32px] 3xs:text-[32px] 2xs:text-[32px] xs:text-[32px] sm:text-[32px] 
                                                  lg:text-[32px] xl:text-4xl 2xl:text-5xl 3xl:text-5xl 4xl:text-5xl 5xl:text-5xl 
                                                  6xl:text-5xl 7xl:text-5xl 8xl:text-6xl text-royalBlue">
                <span class="flex items-center">
                    Innovative
                    <img src="images/title_vector.svg" alt="title_vector" class="inline-block max-h-8 object-contain pl-2">
                </span>

                <span class="text-skyBlue block w-full sm:w-auto">Digital Solutions</span>

                <span class="block w-full sm:w-auto">for Every Industry</span>
            </div>

            <div
                class="z-10 font-poppins 5xs:text-base 4xs:text-base 3xs:text-base 2xs:text-base xs:text-base sm:text-base md:text-base lg:text-base xl:text-base 2xl:text-lg 3xl:text-lg 4xl:text-xl 5xl:text-xl 6xl:text-2xl 7xl:text-2xl 8xl:text-3xl text-royalBlue font-medium ">
                Driving transformation from insight to implementation
            </div>

            <div class="z-10 block md:flex items-center md:flex-wrap flex-none gap-2 mt-2">
                <div>
                    <button routerLink="/ourServices"
                        class="rounded-full md:w-fit !w-full px-10 8xl:py-6 py-4  bg-buttonCyan text-royalBlue font-medium hover:bg-skyBlue hover:text-royalBlue transition-colors duration-500">
                        <div
                            class="font-bold 2xl:text-nowrap text-wrap 5xs:text-base 4xs:text-base 3xs:text-base 2xs:text-base xs:text-base md:text-base sm:text-base lg:text-base xl:text-base 2xl:text-base 3xl:text-base 4xl:text-base 5xl:text-lg 6xl:text-lg 7xl:text-2xl 8xl:text-2xl">
                            Explore Our Services
                        </div>
                    </button>
                </div>
                <div class="5xs:mt-2 4xs:mt-2 3xs:mt-2 2xs:mt-2 xs:mt-2 md:mt-2 sm:mt-2 lg:mt-0">
                    <button routerLink="/aboutUs"
                        class="rounded-full md:w-fit w-full px-8 8xl:py-6 py-4  border-[1.5px] border-royalBlue  text-royalBlue  font-medium hover:bg-royalBlue hover:text-white bg-transparent  transition-colors duration-500">
                        <div
                            class="font-bold 5xs:text-base 4xs:text-base 3xs:text-base 2xs:text-base xs:text-base md:text-base  sm:text-base lg:text-base xl:text-base 2xl:text-base 3xl:text-base 4xl:text-base 5xl:text-lg 6xl:text-lg 7xl:text-2xl 8xl:text-2xl">
                            Learn More
                        </div>
                    </button>
                </div>
            </div>
        </div>
        <div class="w-full py-10 m-auto">
            <img src="images/hero_section_second_slide.png" alt="hero_section_second_slide"
                class="bg-center rendering-pixelated disable-blur z-10" loading="lazy" decoding="async">
        </div>
    </div>
</section>
