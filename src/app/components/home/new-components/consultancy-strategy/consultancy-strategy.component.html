    <div class="grid xl:grid-cols-4 lg:grid-cols-3 sm:grid-cols-2 xs:grid-cols-1 gap-7">
        @for (item of consultanciesList(); track $index) {
        <div class="relative overflow-hidden group">
            <!-- Background image -->
            <img [src]="item.img" [alt]="item.img" class="object-cover w-full h-full">

            <!-- Default Title -->
            <div class="absolute bottom-0 left-0">
                <h1 class="5xs:text-base 4xs:text-lg 3xs:text-3xl 2xs:text-4xl xs:text-4xl lg:text-xl xl:text-lg 2xl:text-xl 3xl:text-2xl 4xl:text-2xl 5xl:text-3xl 6xl:text-3xl 7xl:text-4xl 8xl:text-5xl font-bold text-white p-4 group-hover:hidden">
                    {{item.defaultTitle}}
                </h1>
            </div>

            <!-- Hover Content -->
            <div
                class="absolute inset-0 bg-black bg-opacity-60 text-white flex flex-col justify-end p-4 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                <h2 class="5xs:text-base 4xs:text-lg 3xs:text-3xl 2xs:text-4xl xs:text-4xl lg:text-xl xl:text-lg 2xl:text-xl 3xl:text-2xl 4xl:text-2xl 5xl:text-3xl 6xl:text-3xl 7xl:text-4xl 8xl:text-5xl font-bold mb-2 text-aquaBlue">{{item.defaultTitle}}</h2>
                <p class="tracking-widest font-poppins 5xs:text-xs 4xs:text-base 3xs:text-xl 2xs:text-3xl xs:text-3xl sm:text-base lg:text-base xl:text-sm 2xl:text-sm 3xl:text-base 4xl:text-xl 5xl:text-xl 6xl:text-2xl 7xl:text-2xl 8xl:text-4xl font-normal">
                    {{item.hoverTitle}}
                </p>
            </div>
        </div>
        }
    </div>
