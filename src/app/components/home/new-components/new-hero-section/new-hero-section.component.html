<section class="bg-white w-full overflow-hidden min-h-fit relative">
    <div class="absolute inset-0 w-full">
        <img src="images/bg-new_medium.png" alt="background_image"
            class="bg-cover !w-full h-[670px] object-cover sm:block hidden" loading="lazy" decoding="async">
        <img src="images/new_bg_small_screen.png" alt="background_image"
            class="bg-cover w-full h-[700px] object-cover sm:hidden block" loading="lazy" decoding="async">
    </div>
    <div class="relative z-[20px] mt-10 sm:px-0 px-5">
        <div class="text-center">
            <!-- <h1 class="text-[42px] font-bold text-aquaBlue">Transforming Ideas</h1> -->
            <img src="images/title.svg" alt="title" class="m-auto sm:block hidden" loading="lazy" decoding="async">
            <h1 class="text-[32px] sm:hidden block text-aquaBlue -tracking-wide font-bold">Transforming Ideas </h1>
            <h1 class="sm:text-[42px] text-[32px] font-bold text-textSecondary -mt-2">into Scalable Tech Solutions</h1>
            <p class="font-poppins text-base text-lightGray py-4">At VERAST, we build future-ready platforms for
                startups
                and enterprises alike.</p>
        </div>

        <div class="sm:flex block items-center gap-4 m-auto justify-center">
            <div>
                <button routerLink="/ourServices"
                    class="rounded-none sm:w-fit w-full px-12 8xl:py-6 py-4  bg-buttonCyan text-royalBlue font-bold hover:bg-royalBlue hover:text-white transition-colors duration-500">
                    <div
                        class="font-bold 2xl:text-nowrap text-wrap 5xs:text-base 4xs:text-base 3xs:text-base 2xs:text-base xs:text-base md:text-base sm:text-base lg:text-base xl:text-base 2xl:text-base 3xl:text-base 4xl:text-base 5xl:text-lg 6xl:text-lg 7xl:text-2xl 8xl:text-2xl">
                        Explore Our Services
                    </div>
                </button>
            </div>
            <div class="sm:mt-0 mt-4">
                <button routerLink="/aboutUs"
                    class="rounded-none sm:w-fit w-full px-14 8xl:py-6 py-[15px]  bg-transparent text-royalBlue font-bold hover:bg-royalBlue hover:text-white transition-colors duration-500 border-[1px] border-royalBlue">
                    <div
                        class="font-bold 2xl:text-nowrap text-wrap 5xs:text-base 4xs:text-base 3xs:text-base 2xs:text-base xs:text-base md:text-base sm:text-base lg:text-base xl:text-base 2xl:text-base 3xl:text-base 4xl:text-base 5xl:text-lg 6xl:text-lg 7xl:text-2xl 8xl:text-2xl">
                        Learn More
                    </div>
                </button>
            </div>
        </div>
        <!-- arrow small screen -->
        <div class="m-auto absolute sm:hidden block">
            <img src="images/hero_section_arrow.svg" alt="hero_section_arrow" class="w-3/4">
        </div>
        <!-- arrow large screen -->
        <div
            class="m-auto absolute sm:block hidden md:ml-24 lg:ml-44 xl:ml-60 2xl:ml-66 3xl:ml-66 4xl:ml-80 5xl:ml-80 6xl:ml-80 7xl:ml-[410px] 8xl:ml-[450px] 9xl:ml-[480px] -mt-12">
            <img src="images/hero_section_arrow.svg" alt="hero_section_arrow">
        </div>

        <div class="sm:mt-8 mt-24 flex justify-center">
            <div class="relative group sm:w-1/2 w-full">
                <!-- Default Image -->
                <img src="images/laptop_img.svg" alt="laptop_img"
                    class="m-auto w-full duration-500 opacity-100 group-hover:opacity-20">

                <!-- Hover Image -->
                <img src="images/laptop_img_hover.svg" alt="laptop_img"
                    class="m-auto w-full absolute inset-0  duration-500 opacity-0 group-hover:opacity-100">
            </div>
        </div>

    </div>
</section>
