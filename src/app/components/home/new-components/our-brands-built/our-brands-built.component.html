    @for (brand of brandList(); track brand) {
    <div class="bg-moreLightCyan p-10">
        <div class="flex flex-wrap items-center justify-between gap-6 w-full">

            <div class="flex justify-center items-center flex-col flex-[1_1_20%] group cursor-pointer">
                <div class="relative p-10 rounded-full w-48 h-48 shadow-[0_2px_12px_rgba(99,132,255,0.25)] 
                            flex justify-center items-center transition-all duration-500 
                            group-hover:bg-royalBlue group-hover:bg-opacity-95">

                    <img [src]="brand.brandImage" [alt]="brand.brandImage"
                        class="w-full h-auto transition-opacity duration-500 group-hover:opacity-25" />

                    <span class="absolute text-white font-bold text-lg opacity-0 transition-opacity duration-500 
                        group-hover:opacity-100">
                        {{ brand.brandTitle }}
                    </span>
                </div>
            </div>

            @for (item of brand.subBrandList; track $index) {
            <div class="flex-[1_1_20%] flex flex-col gap-4 px-6 pb-10 sm:pb-0 
                    border-b sm:border-b-0 sm:border-r border-lightGray/40 
                    last:border-b-0 sm:last:border-r-0 sm:text-left text-center">
                <div
                    class="sm:w-20 sm:h-20 w-14 h-14 bg-aquaBlue rounded-full flex justify-center items-center sm:m-0 m-auto">
                    <img [src]="item.image" [alt]="item.image" class="sm:w-9 sm:h-9 w-6 h-6">
                </div>

                <h1 class="text-2xl font-bold text-cornFlowerBlue">
                    {{ item.title }}
                </h1>
                <p class="font-poppins font-normal text-lg text-textSecondary">
                    {{ item.description }}
                </p>
            </div>
            }
        </div>
    </div>
    }

</section>
