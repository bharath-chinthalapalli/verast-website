    <div class="flex flex-col gap-6 justify-center text-center">
        <h2 class="sm:text-xl text-base text-royalBlue font-semibold items-center text-center m-auto flex gap-2">
            <span class="text-base mb-1 font-medium text-skyBlue">
                &#8212;
            </span>
            <span class="text-royalBlue">
                Technology
            </span>
            <span class="text-skyBlue">
                Expertise
            </span>
        </h2>
        <h1 class="sm:text-[40px] text-[32px] text-textSecondary font-bold -tracking-wide">
            Partnered with global tech leaders
        </h1>
    </div>
    <!-- techology expertise -->
    <div class="relative">

        <div class="3xs:pt-0 pt-4">
            <!-- Custom Arrows -->
            <button class="arrow-btn 3xs:left-[-14px] left-[-6px]" (click)="slickModal.slickPrev()">
                <mat-icon>west</mat-icon>
            </button>
            <button class="arrow-btn 3xs:right-[-14px] right-[-6px]" (click)="slickModal.slickNext()">
                <mat-icon>east</mat-icon>
            </button>
            <!-- Slick Carousel w-24-->
            <ngx-slick-carousel #slickModal="slick-carousel" [config]="slideConfig" class="carousel 3xs:px-16 px-2">
                @for (logos of technologyList(); track logos) {
                <div ngxSlickItem class="px-1">
                    <img [src]="logos.clinetLogo" alt="Client Logo" class="!w-32 m-auto" loading="lazy" />
                </div>
                }
            </ngx-slick-carousel>
        </div>
    </div>
