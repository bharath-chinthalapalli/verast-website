<section class="3xs:px-[60px] px-5 mt-4">
    <div class="flex flex-col gap-8">
        <div class="px-2 text-lightGray  3xs:text-center text-left font-normal !font-poppins leading-relaxed tracking-widest 5xs:text-sm 4xs:text-base 3xs:text-base 2xs:text-base xs:text-base sm:text-base 
            lg:text-base xl:text-base 2xl:text-base 3xl:text-base 4xl:text-lg 5xl:text-lg 
            6xl:text-lg 7xl:text-lg 8xl:text-xl">
            At <strong>VERAST Information Technology</strong>, we blend passion, expertise, and innovation to offer exceptional services
            that stand the test of time with a consideration of below:
        </div>
        <div class="grid xl:grid-cols-4 lg:grid-cols-3 sm:grid-cols-2 xs:grid-cols-2 2xs:grid-cols-1 gap-7">
            @for (item of clientCustomerList(); track $index) {
            <div
                class="relative group cursor-auto hover:border-none hover:shadow-[0px_11px_14px_rgba(2,0,136,0.09)] bg-white transition-shadow inset-0 duration-500 ease-in-out delay-75 flex flex-col gap-6 pt-8 pb-6 px-[2px] text-center border-[1.5px] border-[#4F4F64]/10">
                <!-- Icons -->
                <img [src]="item.imageDefault"
                    class="block group-hover:hidden transition-opacity duration-1000 w-full m-auto inset-0 ease-in-out opacity-100 group-hover:opacity-0 object-contain "
                    [alt]="item.imageDefault" loading="lazy" decoding="async">
                <img [src]="item.imageHover"
                    class="hidden group-hover:block transition-opacity duration-100 w-full m-auto inset-0 ease-in-out opacity-0 group-hover:opacity-100 object-contain "
                    [alt]="item.imageDefault" loading="lazy" decoding="async">
                <!-- Title -->
                <div
                    class="px-4 text-xl text-royalBlue tracking-wider font-bold xl:line-clamp-8 line-clamp-4 min-h-[80px]">
                    {{item.title}}
                </div>
                <!-- Bottom line -->
                <div
                    class="absolute -bottom-1.5 left-0 w-full h-[8px] opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <div class="h-[2px] bg-cyan-400 w-full relative"></div>
                </div>
            </div>
            }
        </div>
    </div>
</section>
