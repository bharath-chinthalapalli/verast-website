<section class="3xs:px-[60px] px-5">
    <div class="flex flex-col gap-6 ">
        <div class="w-full  3xs:text-center text-left font-bold leading-relaxed 5xs:text-3xl 4xs:text-[32px] 3xs:text-[32px] xl:text-[32px] 2xl:text-[40px] 2xl:leading-10 3xl:text-[40px] 3xl:leading-10 4xl:text-5xl 5xl:text-5xl 6xl:text-5xl 7xl:text-5xl 8xl:text-6xl text-royalBlue">
            Clients
            <span class="text-skyBlue">
                and Customers
            </span>
        </div>
        <div class="grid xl:grid-cols-3 lg:grid-cols-2 sm:grid-cols-2 xs:grid-cols-1 gap-8">
            @for (item of clientCustomerList(); track $index) {
            <div
                class="relative group cursor-auto hover:border-none hover:shadow-[-1px_-1px_18px_rgba(2,0,136,0.09)] bg-white transition-shadow inset-0 duration-500 ease-in-out delay-75 flex flex-col gap-6 pt-8 pb-4  px-4 text-center border-[1.5px] border-[#4F4F64]/10">
                <!-- Icons -->
                <!-- <img [src]="item.imageDefault"
                    class="block group-hover:hidden transition-opacity duration-1000 w-16 m-auto inset-0 ease-in-out opacity-100 group-hover:opacity-0 object-contain "
                    [alt]="item.imageDefault" loading="lazy" decoding="async">
                <img [src]="item.imageHover"
                    class="hidden group-hover:block transition-opacity duration-100 w-16 m-auto inset-0 ease-in-out opacity-0 group-hover:opacity-100 object-contain "
                    [alt]="item.imageDefault" loading="lazy" decoding="async"> -->

                <img [src]="item.imageDefault"
                    class="w-16 m-auto bg-lightCyan group-hover:bg-aquaBlue p-2.5 rounded-full duration-500 transition-transform group-hover:scale-x-[-1]"
                    [alt]="item.imageDefault" loading="lazy" decoding="async">
                <!-- Title -->
                <div class="text-xl text-royalBlue tracking-wider font-bold xl:line-clamp-2 line-clamp-0 min-h-[20px]">
                    {{item.title}}
                </div>

                <!-- Subtitle -->
                <div
                    class="px-2 text-base text-lightGray tracking-widest font-normal font-poppins xl:line-clamp-8 line-clamp-4 min-h-[80px]">
                    {{item.subTitle}}
                </div>
            </div>
            }
        </div>
    </div>
</section>
